[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/grupos"
  to = "/.netlify/functions/grupos"
  status = 200

[[redirects]]
  from = "/api/academy/content"
  to = "/.netlify/functions/academy-content"
  status = 200

[[redirects]]
  from = "/api/mi-sml/me"
  to = "/.netlify/functions/mi-sml-me"
  status = 200

[[redirects]]
  from = "/api/mi-sml/*"
  to = "/.netlify/functions/mi-sml-me"
  status = 200

[[redirects]]
  from = "/mi-sml"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mi-sml/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/academia"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/academia/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacidad"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/aviso-legal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mi-sml*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/mi-sml/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
