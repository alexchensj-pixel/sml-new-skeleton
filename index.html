    <meta name="robots" content="index,follow,max-image-preview:large" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html,body,#root{min-height:100%;margin:0;background:#101114;color:#f1f1ee}
      body{min-width:320px;overflow-x:hidden}
      #root{min-height:100vh}
    </style>
    <link rel="stylesheet" href="/conversion.css" />
    <style>
      /* Mobile: the method copy must flow naturally; the sticky 100svh stage
         clipped the evaluation card and its CTA on short phone viewports. */
      @media (max-width: 680px) {
        .method-section {
          height: auto !important;
          min-height: 0 !important;
          padding: 0 !important;
        }
        .method-stage {
          position: relative !important;
          top: auto !important;
          height: auto !important;
          min-height: 100svh !important;
          overflow: visible !important;
          padding: 96px 18px 42px !important;
        }
        .method-copy,
        .method-evaluation,
        .method-stations {
          flex: 0 0 auto;
          min-width: 0;
        }
        .method-stations {
          margin-top: 26px !important;
        }
        .method-coordinate {
          position: relative !important;
          right: auto !important;
          bottom: auto !important;
          align-self: flex-end;
          margin-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Striking Motion Lab necesita JavaScript para mostrar la experiencia interactiva.</noscript>
